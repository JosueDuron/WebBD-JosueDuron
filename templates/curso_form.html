{% extends 'base.html' %}
{% block title %}{{ 'Editar curso' if curso else 'Nuevo curso' }}{% endblock %}
{% block content %}
<h1 class="mb-4">{{ 'Editar curso' if curso else 'Nuevo curso' }}</h1>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre del curso</label>
                <input type="text" name="nombre" class="form-control"
                       value="{{ curso.nombre if curso else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" class="form-control" rows="3">{{ curso.descripcion if curso else '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-save"></i> Guardar
            </button>
            <a href="{{ url_for('listar_cursos') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
