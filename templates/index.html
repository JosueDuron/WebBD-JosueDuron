{% extends 'base.html' %}
{% block title %}Inicio{% endblock %}
{% block content %}
<h1 class="mb-4">Panel principal</h1>
<div class="row g-4">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <i class="fa-solid fa-book fa-2x text-primary mb-2"></i>
            <h3>{{ total_cursos }}</h3>
            <p class="text-muted mb-2">Cursos registrados</p>
            <a href="{{ url_for('listar_cursos') }}" class="btn btn-outline-primary btn-sm">Ver cursos</a>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <i class="fa-solid fa-users fa-2x text-success mb-2"></i>
            <h3>{{ total_estudiantes }}</h3>
            <p class="text-muted mb-2">Estudiantes registrados</p>
            <a href="{{ url_for('listar_estudiantes') }}" class="btn btn-outline-success btn-sm">Ver estudiantes</a>
        </div>
    </div>
</div>
{% endblock %}
